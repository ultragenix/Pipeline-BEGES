name: beges
version: "1.0.0"
config-version: 2

profile: beges

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  beges:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    quality:
      +materialized: view
      +tags: ["quality"]
