version: 2

models:
  - name: ops_ingestion_last_run
    description: "Dernier chargement réussi ou échoué pour chaque couple entreprise × source."
    columns:
      - name: source_key
        data_tests: [unique, not_null]
      - name: company_code
        data_tests: [not_null]
      - name: source_id
        data_tests: [not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["success", "partial", "failed"]
      - name: rows_loaded
        data_tests: [not_null]
      - name: rows_quarantined
        data_tests: [not_null]
      - name: finished_at
        data_tests: [not_null]

  - name: ops_quarantine_summary
    description: "Lignes en quarantaine agrégées par entreprise, source et raison."
    columns:
      - name: quarantine_key
        data_tests: [unique, not_null]
      - name: company_code
        data_tests: [not_null]
      - name: source_id
        data_tests: [not_null]
      - name: reason_code
        data_tests: [not_null]
      - name: nb_lignes
        data_tests: [not_null]

  - name: ops_freshness
    description: "Couverture temporelle des sources brutes par entreprise et type de source."
    columns:
      - name: freshness_key
        data_tests: [unique, not_null]
      - name: company_code
        data_tests: [not_null]
      - name: source_type
        data_tests: [not_null]
      - name: nb_lignes
        data_tests: [not_null]
