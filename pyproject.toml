[project]
name = "pipeline-beges"
version = "0.1.0"
description = "Pipeline de données pour produire un BEGES fiable à partir de fichiers clients hétérogènes."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Pipeline BEGES contributors" }]
dependencies = [
  "duckdb>=1.3.0",
  "dbt-duckdb>=1.9.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "pyyaml>=6.0.2",
  "jinja2>=3.1.4",
]

[dependency-groups]
dev = [
  "ruff>=0.9.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beges"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
